# NewRuz — Render Blueprint (https://render.com/docs/blueprint-spec)
# Deploy: push repo to GitHub/GitLab, then Dashboard → New → Blueprint

databases:
  - name: newruz-db
    databaseName: newruz
    user: newruz
    plan: free

services:
  # Django REST API
  - type: web
    name: newruz-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    healthCheckPath: /api/programs/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: newruz-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ADMIN_EMAIL
        value: ainulloevao@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_TOKEN
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: newruz-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: newruz-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CSRF_TRUSTED_ORIGINS
        fromService:
          type: web
          name: newruz-web
          envVarKey: RENDER_EXTERNAL_URL
      # Render blocks SMTP (ports 587/465). Use Resend HTTPS API instead:
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: NewRuz <onboarding@resend.dev>
      # Optional: Gmail API (refresh token with gmail.send scope)
      # - key: GOOGLE_MAIL_REFRESH_TOKEN
      #   sync: false
      # GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET, GOOGLE_OAUTH_REDIRECT_URI

  # Vite React frontend (static site — no "plan" field; static sites are free by default)
  - type: web
    name: newruz-web
    runtime: static
    buildCommand: npm install && VITE_API_URL="${NEWUZ_API_URL}/api" npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NEWUZ_API_URL
        fromService:
          type: web
          name: newruz-api
          envVarKey: RENDER_EXTERNAL_URL
